# Mist Launcher: Niagara-style Android launcher (ek file mein poora project).
# GitHub repo mein sirf yahi file chahiye: .github/workflows/build.yml
# Commit karte hi APK banta hai aur "Releases" mein seedha .apk milta hai (zip nahi).
# Paste poora hua hai ya nahi: file ke sabse neeche "FILE END" likha hona chahiye.

name: Build Mist Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack project and check paste is complete
        run: |
          echo "$MIST_PAYLOAD" | base64 -d > project.tar.gz || true
          if ! echo "$MIST_SHA256  project.tar.gz" | sha256sum -c -; then
            echo "::error::build.yml adhoori paste hui hai. Puri file dubara copy karke paste karo (sabse neeche FILE END dikhna chahiye)."
            exit 1
          fi
          tar xzf project.tar.gz
          rm project.tar.gz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MistLauncher.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mist Launcher build ${{ github.run_number }}
          files: MistLauncher.apk

