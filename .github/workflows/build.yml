# Mist Launcher APK builder.
# Repo mein ye file (.github/workflows/build.yml), c1.txt, c2.txt, p1.txt ... p5.txt, u1.txt, u2.txt,
# u3a.txt ... u3d.txt, u5a.txt, u5b.txt, u6a.txt aur u6b.txt hone chahiye.
# Saari patch logic c1.txt + c2.txt ke andar hai (hash se check hoti hai), isliye ye file chhoti rehti hai.
# Naya update (u7, u8 ...): uNa.txt, uNb.txt ... pehle commit karo, phir hashes.txt mein unki "uNa.txt <hash>" lines
# jodo (hashes.txt aakhir mein commit karo). Is file ko dobara badalna nahi padta.
# c2.txt, hashes.txt, u3d.txt, u2.txt, u1.txt, p5.txt, u5b.txt ya u6b.txt commit hote hi APK banna shuru ho jata hai.
# APK "Releases" mein seedha .apk milti hai (zip nahi).

name: Build Mist Launcher APK

on:
  workflow_dispatch:
  push:
    paths: [ 'p5.txt', 'u1.txt', 'u2.txt', 'u3d.txt', 'u5b.txt', 'u6b.txt', 'c2.txt', 'hashes.txt', '.github/workflows/build.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack parts and apply patches (c1 + c2 -> ci.sh)
        run: |
          ok=1
          while read -r f want; do
            if [ ! -f "$f" ]; then
              echo "::error::$f nahi mila. Isi naam se file banao (repo ke root mein) aur uska content paste karo."
              ok=0
              continue
            fi
            got=$(tr -d '[:space:]' < "$f" | sha256sum | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::$f adhoori ya galat paste hui hai. Sirf is file ko dobara copy karke paste karo."
              ok=0
            fi
          done <<'LIST'
          c1.txt a4210e7af10752946885a8bb7d160fd2316e8ece943ccc7f9bcf802be3212d2a
          c2.txt ead3db441ecf3001eca53990f376a73db369e6d2323027116e9a4af30b18cb78
          LIST
          [ "$ok" = 1 ] || exit 1
          cat c1.txt c2.txt | tr -d '[:space:]' | base64 -d | tar xJ
          bash ci.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ "$code" != 0 ]; then
            grep -E '^e: ' build.log | sed -E 's#file:///[^ ]*/work/[^/]*/[^/]*/##' > errors.txt
            {
              echo "### Build errors"
              echo '```'
              head -40 errors.txt
              grep -A4 '[*] What went wrong' build.log | head -8
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            head -10 errors.txt | while IFS= read -r line; do echo "::error::$line"; done
            if [ ! -s errors.txt ]; then
              grep -A4 '[*] What went wrong' build.log | head -6 | while IFS= read -r line; do echo "::error::$line"; done
            fi
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MistLauncher.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ github.run_number }}
          name: Mist Launcher v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          files: MistLauncher.apk
          
